<style>
:root{
  --bg:#F3F3F3; --panel:#FFFFFF; --ink:#000000; --muted:#5C5C5C; --line:#D6D6D6;
  --red:#D20033; --red-ink:#FFFFFF; --black:#000000; --black-ink:#FFFFFF;
  --accent:var(--red); --accent-ink:var(--red-ink);
  --must:#A3001F; --must-bg:#FCE6EB; --should:#8A5A00; --should-bg:#FFF2D2;
  --ok:#1F6B36; --ok-bg:#E3F2E7; --skip:#5C5C5C; --skip-bg:#ECECEC;
  --gray-row:#E6E6E6; --disc:transparent;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --panel:#1D1D1D; --ink:#F5F5F5; --muted:#A8A8A8; --line:#343434;
    --red:#FF3358; --red-ink:#FFFFFF; --black:#000000; --black-ink:#FFFFFF;
    --must:#FF8A9E; --must-bg:#3A1219; --should:#F5C451; --should-bg:#3A2E10;
    --ok:#7DD3A0; --ok-bg:#12301E; --skip:#A8A8A8; --skip-bg:#2A2A2A; --gray-row:#2A2A2A; --disc:#FFFFFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --panel:#1D1D1D; --ink:#F5F5F5; --muted:#A8A8A8; --line:#343434;
  --red:#FF3358; --red-ink:#FFFFFF; --black:#000000; --black-ink:#FFFFFF;
  --must:#FF8A9E; --must-bg:#3A1219; --should:#F5C451; --should-bg:#3A2E10;
  --ok:#7DD3A0; --ok-bg:#12301E; --skip:#A8A8A8; --skip-bg:#2A2A2A; --gray-row:#2A2A2A; --disc:#FFFFFF;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,"Segoe UI",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 24px;border-bottom:6px solid var(--red);box-shadow:0 3px 0 var(--black);background:var(--panel);flex-wrap:wrap;margin-bottom:3px}
.brand{display:flex;align-items:center;gap:14px}
.brand .badge{width:76px;height:76px;border-radius:50%;background:var(--disc);display:grid;place-items:center;flex:none}
.brand .badge img{width:72px;height:72px;object-fit:contain;display:block}
.brand .league{font:700 13px Barlow,sans-serif;color:var(--red);letter-spacing:.02em}
.gatelogo{display:block;width:min(240px,64vw);aspect-ratio:1;object-fit:contain;margin:8px auto 18px;background:var(--disc);border-radius:50%;padding:18px;box-sizing:border-box}
header.top h1{margin:0;font-size:32px;font-weight:800;letter-spacing:.01em;line-height:1}
header.top .div{color:var(--muted);font-weight:600}
nav.steps{display:flex;gap:4px;flex-wrap:wrap}
nav.steps button{border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 12px;border-radius:6px;font:600 14px Barlow,sans-serif;cursor:pointer}
nav.steps button.on{background:var(--black);color:var(--black-ink);border-color:var(--black)}
nav.steps button:disabled{opacity:.4;cursor:default}
main{max-width:1400px;margin:0 auto;padding:24px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:20px}
.panel h2{margin:0 0 4px;font-size:26px;font-weight:700}
.team h3{border-top:4px solid var(--black);padding-top:6px}
.sub{color:var(--muted);margin:0 0 16px}
button.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 18px;font:700 16px Barlow,sans-serif;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font:600 15px Barlow,sans-serif;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{font:500 16px Barlow,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;min-width:26px;text-align:center;font-size:12px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--skip-bg);color:var(--muted);margin-right:3px}
.chip.on{background:var(--black);color:var(--black-ink)}
.flag{font-size:13px;font-weight:600;padding:2px 8px;border-radius:999px}
.flag.must{background:var(--must-bg);color:var(--must)} .flag.should{background:var(--should-bg);color:var(--should)} .flag.ok{background:var(--ok-bg);color:var(--ok)}
.note{border-left:4px solid var(--accent);padding:10px 14px;background:var(--bg);border-radius:0 8px 8px 0;margin:12px 0}
.note.must{border-color:var(--must)} .note.ok{border-color:var(--ok)} .note.should{border-color:var(--should)}
.err{color:var(--must);font-weight:600;min-height:1.4em}
.tier{font:800 13px "Barlow Condensed",sans-serif;padding:1px 7px;border-radius:4px}
.tier.A{background:var(--accent);color:var(--accent-ink)} .tier.C{background:var(--black);color:var(--black-ink)} .tier.B{background:var(--skip-bg);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
/* draft */
.clock{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px}
@media (max-width:1000px){.clock{grid-template-columns:1fr}}
.onclock{background:var(--red);color:var(--red-ink);border-radius:12px;padding:22px 26px;border-bottom:8px solid var(--black)}
.onclock .lbl{font-size:15px;opacity:.75}
.onclock .who{font:800 clamp(56px,8vw,104px)/0.95 "Barlow Condensed",sans-serif;margin:4px 0 8px}
.onclock .meta{font-size:18px;opacity:.9}
.status{border-radius:10px;padding:14px 18px;margin-top:16px;font-size:19px;font-weight:600}
.status.must{background:var(--must-bg);color:var(--must)} .status.should{background:var(--should-bg);color:var(--should)} .status.ok{background:var(--ok-bg);color:var(--ok)}
.pickbox{display:flex;gap:10px;margin-top:16px}
.pickbox input{font:800 34px "Barlow Condensed",sans-serif;width:150px;text-align:center}
.board tr.allowed td{background:transparent}
.board tr.mand td{background:var(--must-bg)}
.board tr.sugg td{background:var(--should-bg)}
.board tr.blocked td{opacity:.45}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.team{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel)}
.team.cur{border:3px solid var(--red)}
.team h3{margin:0;font-size:22px}
.team .tm{color:var(--muted);font-size:14px;margin-bottom:6px}
.team ol{margin:0;padding-left:0;list-style:none;font-size:14px}
.team li{display:flex;gap:6px;align-items:center;padding:2px 0}
.log{max-height:260px;overflow:auto;font-size:14px}
.log div{padding:3px 0;border-bottom:1px dashed var(--line)}
dialog{border:0;border-radius:12px;padding:24px;max-width:560px;background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.big{font:800 40px "Barlow Condensed",sans-serif}
.muted{color:var(--muted)}
details summary{cursor:pointer;font-weight:600}
.narrow{max-width:720px;margin-left:auto;margin-right:auto}
label.nt{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600}
label.nt input{width:18px;height:18px;margin:0;padding:0}
.ok-txt{color:var(--ok);font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

function hashStr(t){let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(16).padStart(8,'0');}
const baseHash=d=>hashStr(JSON.stringify(d));

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const r=new Uint32Array(1);crypto.getRandomValues(r);const j=r[0]%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- max flow (Dinic) ---------- */
function flow(nv,edges,s,t){const g=Array.from({length:nv},()=>[]);const E=[];
  edges.forEach(([u,v,c])=>{g[u].push(E.length);E.push({v,c});g[v].push(E.length);E.push({v:u,c:0});});
  let f=0;const lvl=new Array(nv),it=new Array(nv);
  const bfs=()=>{lvl.fill(-1);lvl[s]=0;const q=[s];while(q.length){const u=q.shift();for(const id of g[u]){const e=E[id];if(e.c>0&&lvl[e.v]<0){lvl[e.v]=lvl[u]+1;q.push(e.v);}}}return lvl[t]>=0;};
  const dfs=(u,p)=>{if(u===t)return p;for(;it[u]<g[u].length;it[u]++){const id=g[u][it[u]],e=E[id];if(e.c>0&&lvl[e.v]===lvl[u]+1){const d=dfs(e.v,Math.min(p,e.c));if(d>0){e.c-=d;E[id^1].c+=d;return d;}}}return 0;};
  while(bfs()){it.fill(0);let d;while((d=dfs(s,1e9))>0)f+=d;}
  return {f,g,E};}

/* feasibility: can every remaining player still get a team on a night she can make, with tier quotas and team sizes respected? */
function feasible(teams,rem,tierOf){const {base,E}=plan();const nP=rem.length,nT=teams.length;
  const S0=0,P0=1,TT0=P0+nP,TM0=TT0+3*nT,X=TM0+nT,SNK=X+1;const ed=[];const tiers=['A','C','B'];
  rem.forEach((b,i)=>{ed.push([S0,P0+i,1]);const tr=tierOf(b),ti=tiers.indexOf(tr);
    teams.forEach((t,j)=>{if(nightsOf(b).includes(t.night))ed.push([P0+i,TT0+3*j+ti,1]);});});
  let used=0;teams.forEach(t=>{if(t.players.length>base)used++;});
  if(used>E||teams.some(t=>t.players.length>base+(E>0?1:0)))return {ok:false,unmatched:[...rem]};
  teams.forEach((t,j)=>{ed.push([TT0+3*j,TM0+j,Math.max(0,t.qA-t.a)]);ed.push([TT0+3*j+1,TM0+j,Math.max(0,t.qC-t.c)]);ed.push([TT0+3*j+2,TM0+j,999]);
    const n=t.players.length;ed.push([TM0+j,SNK,Math.max(0,base-n)]);if(E>0&&n<base+1)ed.push([TM0+j,X,1]);});
  ed.push([X,SNK,Math.max(0,E-used)]);
  const r=flow(SNK+1,ed,S0,SNK);
  const unmatched=rem.filter((b,i)=>{const id=r.g[S0].find(id=>r.E[id].v===P0+i);return r.E[id].c>0;});
  return {ok:r.f===nP,unmatched};}

/* ---------- A & C lists ---------- */
function computeLists(){const t=T(),st={};ALL.forEach(b=>st[b]={A:0,AB:0,C:0});
  Object.values(S.grades).forEach(g=>{(g.A||[]).forEach(b=>st[b]&&st[b].A++);(g.AB||[]).forEach(b=>st[b]&&st[b].AB++);(g.C||[]).forEach(b=>st[b]&&st[b].C++);});
  const pts=b=>2*st[b].A+st[b].AB, cov=b=>st[b].A+st[b].AB;
  const aNom=ALL.filter(b=>cov(b)>0).sort((x,y)=>cov(y)-cov(x)||st[y].A-st[x].A||pts(y)-pts(x)||x-y);
  let kA=Math.floor(aNom.length/t),flags=[];if(kA<1){kA=0;flags.push(`Only ${aNom.length} A nominees for ${t} teams. Not enough for one per team.`);}
  let A=aNom.slice(0,kA*t),cutA=aNom.slice(kA*t);
  if(A.length&&cutA.length){const l=A[A.length-1],c=cutA[0];if(cov(l)===cov(c)&&st[l].A===st[c].A&&pts(l)===pts(c)){
    flags.push({tie:true,kept:l,cut:c});if(S.tieSwap){A[A.length-1]=c;cutA[0]=l;}}}
  const exp=b=>(+PL[b].rec||0)+(+PL[b].trav||0);
  const cNom=ALL.filter(b=>st[b].C>0&&!A.includes(b)).sort((x,y)=>st[y].C-st[x].C||exp(x)-exp(y)||x-y);
  const kC=Math.floor(cNom.length/t);let C=cNom.slice(0,kC*t),cutC=cNom.slice(kC*t);const cNotes=[];
  if(C.length&&cutC.length){const l=C[C.length-1],c=cutC[0];if(st[l].C===st[c].C)cNotes.push(exp(l)===exp(c)?`#${l} and #${c} tied on C’s and experience; tool kept #${l}.`:`#${l} kept over #${c} (same C count, less experience).`);}
  const bumps=[];S.noShow.forEach(({bib,tier})=>{const L=tier==='A'?A:C;if(L.includes(bib))return;const out=L.pop();L.unshift(bib);bumps.push({bib,tier,out});});
  return {st,aNom,cNom,A,C,cutA,cutC,kA,kC,flags,cNotes,bumps,pts,cov};}

/* ---------- draft engine (replays picks so undo is exact) ---------- */
function tierFn(L){return b=>L.A.includes(b)?'A':L.C.includes(b)?'C':'B';}
function sim(){EXTRA={};const L=computeLists(),tierOf=tierFn(L),{base,max}=plan(),nT=T();
  const teams=S.order.map(n=>({name:n,night:S.coaches[n].night,players:[],a:0,c:0,qA:L.kA,qC:L.kC,owed:0,pre:[]}));
  const und=new Set(ALL);const log=[],notes=[];
  const add=(t,b,how)=>{t.players.push({bib:b,how});const tr=tierOf(b);if(tr==='A')t.a++;if(tr==='C')t.c++;und.delete(b);};
  teams.forEach(t=>{(S.coaches[t.name].daughters||[]).forEach(d=>{if(PL[d]&&und.has(d)){add(t,d,'daughter');t.pre.push(d);const s=LINK[d];if(s&&und.has(s)){add(t,s,'linked');t.pre.push(s);}}});});
  // excess from preloads
  const finalA=L.kA>0?((L.kA-1)%2===0?[...teams]:[...teams].reverse()):[];let bFirst=[],bLast=[];
  teams.filter(t=>t.a>L.kA).forEach(x=>{const ex=x.a-L.kA;x.qA=x.a;x.qC=L.kC+ex;bLast.push(x.name);
    for(let k=0;k<ex;k++){const d=[...finalA].reverse().find(t=>t.a<L.kA&&t.qA===L.kA);if(d){d.qA=L.kA-1;d.qC=Math.max(0,L.kC-1);bFirst.push(d.name);
      notes.push(`${x.name} holds ${x.a} A’s through coaches’ daughters. ${d.name} will not receive one: ${d.name} picks first in the first B round and takes one fewer C; ${x.name} takes one extra C and picks last.`);}}});
  teams.filter(t=>t.c>t.qC).forEach(x=>{const ex=x.c-x.qC;x.qC=x.c;bFirst.push(x.name);
    for(let k=0;k<ex;k++){const d=[...teams].reverse().find(t=>t.c<t.qC&&t!==x);if(d){d.qC--;bLast.push(d.name);notes.push(`${x.name} holds an extra C through coaches’ daughters; ${x.name} picks first in the first B round and ${d.name} picks last.`);}}});
  const RA=Math.max(0,...teams.map(t=>t.qA-t.a)),RC=Math.max(0,...teams.map(t=>t.qC-t.c));
  const tierOfRound=r=>r<RA?'A':r<RA+RC?'C':'B';
  const orderOf=r=>{let o=r%2===0?[...teams]:[...teams].reverse();if(r===RA+RC&&(bFirst.length||bLast.length)){
    o=[...o.filter(t=>bFirst.includes(t.name)),...o.filter(t=>!bFirst.includes(t.name)&&!bLast.includes(t.name)),...o.filter(t=>bLast.includes(t.name))];}return o;};
  const need=(t,tr)=>tr==='A'?t.qA-t.a:tr==='C'?t.qC-t.c:max-t.players.length;
  const viable=(b,tr)=>teams.filter(t=>need(t,tr)>0&&nightsOf(b).includes(t.night));
  function analyze(t,tr){const rem=[...und];const elig=rem.filter(b=>tierOf(b)===tr);
    const nightOk=elig.filter(b=>nightsOf(b).includes(t.night));
    const base0=feasible(teams,rem,tierOf);
    const test=b=>{const extra=[b];if(LINK[b]&&und.has(LINK[b]))extra.push(LINK[b]);
      const tt=teams.map(x=>x===t?{...x,players:[...x.players,...extra.map(e=>({bib:e}))],a:x.a+extra.filter(e=>tierOf(e)==='A').length,c:x.c+extra.filter(e=>tierOf(e)==='C').length}:x);
      return feasible(tt,rem.filter(r=>!extra.includes(r)),tierOf);};
    let allowed,degraded=false;
    if(base0.ok)allowed=nightOk.filter(b=>test(b).ok);else{allowed=nightOk;degraded=base0.unmatched;}
    const blocked=nightOk.filter(b=>!allowed.includes(b));
    const open=teams.filter(x=>need(x,tr)>0).length;const scarce=open>1?allowed.map(b=>({b,v:viable(b,tr)})).filter(o=>o.v.length===1):[];
    let kind='ok',msg='Open pick.';
    if(!allowed.length){kind='skip';}
    else if(allowed.length===1&&elig.length>1){kind='must';const a=allowed[0];msg=`Must pick #${a} ${nm(a)}. `+(viable(a,tr).length===1?'She has no other possible team.':'Any other pick leaves a player with no team.');}
    else if(blocked.length&&allowed.length<=4){kind='must';msg=allowed.length===1?`Must pick #${allowed[0]} ${nm(allowed[0])}. Any other pick leaves a player with no team.`:`Must pick one of ${allowed.map(b=>'#'+b).join(', ')}. Any other pick strands a player.`;}
    else if(blocked.length){kind='must';msg=`Any pick except ${blocked.map(b=>'#'+b).join(', ')}. Those picks would leave another player with no team.`;}
    else if(scarce.length){kind='should';const o=scarce[0];msg=`Recommend #${o.b} ${nm(o.b)}. ${t.name} is the only team left that fits her nights; pass now and she likely becomes a must-pick next turn.`;}
    return {elig,nightOk,allowed,blocked,kind,msg,scarce:scarce.map(o=>o.b),degraded};}
  let r=0,pos=0,cur=null,guard=0,lastPickR=-1;
  function advance(){while(und.size){if(++guard>5000)return null;const o=orderOf(r);if(pos>=o.length){r++;pos=0;if(r>RA+RC&&r-lastPickR>2)return null;continue;}
      const t=o[pos],tr=tierOfRound(r);
      if(need(t,tr)<=0){pos++;continue;}
      if(!([...und].some(b=>tierOf(b)===tr))){pos++;continue;}
      if(tr==='B'&&t.owed>0){t.owed--;log.push({k:'skip',t:`${t.name} — pick used by linked sister`});pos++;continue;}
      const an=analyze(t,tr);if(an.kind==='skip'){log.push({k:'skip',t:`${t.name} skipped — no remaining ${tr} fits ${NL[t.night]}`});pos++;continue;}
      return {r,pos,t,tr,an,overall:log.filter(l=>l.k==='pick').length+1};}
    return null;}
  for(const p of S.picks){cur=advance();if(!cur)break;if(p.night){EXTRA[p.bib]=[...(EXTRA[p.bib]||[]),p.night];}
    add(cur.t,p.bib,'pick');lastPickR=cur.r;log.push({k:'pick',t:`${cur.t.name} took #${p.bib} ${nm(p.bib)} (${cur.tr})${p.force?' — override':''}${p.night?' — availability confirmed '+NN[p.night]:''}`});
    const s=LINK[p.bib];if(s&&und.has(s)){add(cur.t,s,'linked');if(tierOf(s)==='B')cur.t.owed++;log.push({k:'link',t:`#${s} ${nm(s)} joins ${cur.t.name} (linked player) — counts as their next ${tierOf(s)} pick`});}
    pos=cur.pos+1;r=cur.r;}
  cur=advance();
  return {L,tierOf,teams,und,log,notes,cur,orderOf,tierOfRound,need};}

/* ---------- rendering ---------- */
function nav(){$('#divname').textContent=DATA?`${DATA.division} · ${ALL.length} players · bibs ${Math.min(...ALL)}–${Math.max(...ALL)}`:'';
  if(SCREEN!=='div'){$('#steps').innerHTML='';return;}
  const ok=i=>i<=1||(i===2&&!!S.order)||(i>=3&&gradesDone());
  $('#steps').innerHTML=STEPS.map((s,i)=>`<button class="${S.step===i?'on':''}" ${ok(i)?'':'disabled'} onclick="go(${i})">${s}</button>`).join('')+`<button onclick="changeDivision()">Change division</button><button onclick="resetAll()">Start over</button>`;}
function go(i){S.step=i;save();render();}
function resetAll(){if(confirm(`Clear everything entered for ${DATA.division} on this device (check-in changes, draft order, grades and picks) and start over?`)){S=fresh(BASE);applyCI();save();render();}}
function changeDivision(){SCREEN='pick';try{sessionStorage.removeItem('cggbl-div')}catch(e){}render();}
function gradesDone(){return S.order&&S.gIdx>=S.order.length*3;}
function render(){nav();if(SCREEN==='gate')return gate();if(SCREEN==='pick')return picker();if(SCREEN==='confirm')return confirmDiv();
  [checkin,setup,grades,lists,draft,rosters][S.step]();window.scrollTo(0,0);}

/* ---------- unlock ---------- */
const b64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function decrypt(pass){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));return JSON.parse(new TextDecoder().decode(pt));}
function gate(){$('#app').innerHTML=`<img class="gatelogo" src="${LOGO}" alt="Center Grove Basketball"><section class="panel narrow"><h2>Unlock draft night</h2><p class="sub">Enter the passphrase from the commissioner.</p>
  <div class="row"><input id="pw" type="password" autocomplete="current-password" style="flex:1;min-width:220px" aria-label="Passphrase"><button class="primary" onclick="unlock()">Unlock</button></div><div class="err" id="gwerr"></div></section>`;
  const p=$('#pw');p.focus();p.onkeydown=e=>{if(e.key==='Enter')unlock();};}
async function unlock(pass){const quiet=!!pass;pass=pass||$('#pw').value;if(!pass)return;
  if(!crypto.subtle){$('#gwerr').textContent='This browser can’t open the data. Use the site’s https:// address in Chrome, Safari, Edge or Firefox.';return;}
  try{BUNDLE=await decrypt(pass);}catch(e){if(quiet){try{sessionStorage.removeItem('cggbl-pass')}catch(_){};return gate();}$('#gwerr').textContent='That passphrase didn’t unlock the data. Check it with the commissioner.';return;}
  try{sessionStorage.setItem('cggbl-pass',pass)}catch(e){}
  let last=null;try{last=sessionStorage.getItem('cggbl-div')}catch(e){}
  const i=BUNDLE.divisions.findIndex(d=>d.division===last);
  if(i>=0){const sv=loadKey(keyFor(BUNDLE.divisions[i]));if(sv&&sv.hash===baseHash(BUNDLE.divisions[i])){openDivision(i,sv);return;}}
  SCREEN='pick';render();}

/* ---------- choose a division ---------- */
function progressOf(d){const sv=loadKey(keyFor(d));if(!sv)return null;if(sv.hash!==baseHash(d))return {stale:true};
  return {stale:false,picks:sv.picks.length,grades:Object.keys(sv.grades).length,order:!!sv.order,ci:sv.ciDone,sv};}
function picker(){DATA=null;nav();const opts=BUNDLE.divisions.map((d,i)=>`<option value="${i}" ${PICKED===i?'selected':''}>${esc(d.division)}</option>`).join('');
  $('#app').innerHTML=`<section class="panel narrow"><h2>Which division are you drafting?</h2><p class="sub">${esc(BUNDLE.season)} · data loaded ${esc(BUNDLE.built)}</p>
  <div class="row"><select id="dsel" style="flex:1;min-width:220px" aria-label="Division"><option value="">Choose a division…</option>${opts}</select><button class="primary" onclick="pickDiv()">Continue</button></div><div class="err" id="perr2"></div></section>`;}
function pickDiv(){const v=$('#dsel').value;if(v===''){$('#perr2').textContent='Choose a division first.';return;}PICKED=+v;SCREEN='confirm';render();}
const nightsList=d=>[...new Set(d.coaches.map(c=>c.night))];
function confirmDiv(){const d=BUNDLE.divisions[PICKED];const bibs=d.players.map(p=>p.bib);const pr=progressOf(d);DATA=null;nav();
  let st='',btn='';
  if(!pr)btn=`<button class="primary" onclick="startDiv(false)">Start check-in</button>`;
  else if(pr.stale){st=`<div class="note must">This device has a saved draft for ${esc(d.division)}, but the commissioner has updated the division since it was started. The saved work can’t be used with the new data.</div>`;
    btn=`<button class="primary" onclick="startDiv(true)">Start fresh with the updated data</button>`;}
  else{st=`<div class="note">This device already has ${esc(d.division)} in progress: ${pr.ci?'check-in done':'check-in not finished'}, ${pr.order?'order drawn':'order not drawn'}, ${pr.grades} of ${d.coaches.length} coaches’ grades, ${pr.picks} picks.</div>`;
    btn=`<button class="primary" onclick="startDiv(false)">Resume</button><button class="ghost" onclick="startDiv(true)">Start over</button>`;}
  $('#app').innerHTML=`<section class="panel narrow"><h2>${esc(d.division)}</h2><p class="sub">Check this is the division in the gym tonight.</p>
   <table><tr><th>Players</th><td>${d.players.length} (bibs ${Math.min(...bibs)}–${Math.max(...bibs)})</td></tr><tr><th>Teams</th><td>${d.coaches.length}</td></tr>
   <tr><th>Head coaches</th><td>${d.coaches.map(c=>`${esc(c.name)} (${NN[c.night]})`).join(', ')}</td></tr></table>${st}
   <div class="row" style="margin-top:16px">${btn}<button class="ghost" onclick="SCREEN='pick';render()">Back</button></div></section>`;}
function startDiv(wipe){const d=BUNDLE.divisions[PICKED];let sv=loadKey(keyFor(d));
  if(wipe){if(sv&&!sv.stale&&sv.hash===baseHash(d)&&!confirm(`Clear everything entered for ${d.division} on this device and start over?`))return;sv=null;}
  if(sv&&sv.hash!==baseHash(d))sv=null;openDivision(PICKED,sv);}
function openDivision(i,sv){BASE=BUNDLE.divisions[i];DKEY=keyFor(BASE);S=sv||fresh(BASE);applyCI();SCREEN='div';
  try{sessionStorage.setItem('cggbl-div',BASE.division)}catch(e){}save();render();}

/* ---------- check-in ---------- */
const daughterOf=b=>Object.keys(S.coaches).find(n=>(S.coaches[n].daughters||[]).includes(b));
function checkin(){const locked=S.picks.length>0;const ch=Object.keys(S.ci.nights).map(Number).sort((a,b)=>a-b);
  const unconf=ALL.filter(b=>!PL[b].confirmed);
  const linkRows=(DATA.links||[]).map(([a,b])=>{const mine=S.ci.links.some(l=>l[0]===a&&l[1]===b);return `<tr><td>#${a} ${esc(nm(a))}</td><td>#${b} ${esc(nm(b))}</td><td>${mine?(locked?'added at check-in':`<button class="ghost" onclick="rmLink(${a},${b})">Remove</button>`):'<span class="muted">set at registration</span>'}</td></tr>`;}).join('');
  let h=`<section class="panel"><h2>Check-in changes</h2><p class="sub">Work top to bottom through all three sections: no-shows, linked players, availability. Enter only what changed at check-in; everything else is already loaded.</p>
   ${locked?`<div class="note should">The draft has started, so check-in changes are locked. For a night a family confirms mid-draft, use the override when that pick is entered.</div>`:''}</section>
  <section class="panel"><h2>1. No-shows</h2><p class="sub">Players who didn’t check in. They become missed evals.</p>
   ${locked?'':`<div class="row"><input id="abs" style="flex:1;min-width:200px" placeholder="Bibs, e.g. 12, 31" value="${S.absent.join(', ')}"><button class="primary" onclick="saveAbsent()">Save no-shows</button></div><div class="err" id="aerr"></div>`}
   <p>${S.absent.length?S.absent.map(b=>`#${b} ${esc(nm(b))}`).join('<br>'):'<span class="muted">None</span>'}</p></section>
  <section class="panel"><h2>2. Linked players (same team)</h2><p class="sub">Two girls who must play on the same team, such as sisters or cousins. Both must be in this division. Drafting one places the other.</p>
   ${locked?'':`<div class="row"><input id="la" inputmode="numeric" placeholder="Bib" style="width:100px" aria-label="First linked player bib"><input id="lb" inputmode="numeric" placeholder="Bib" style="width:100px" aria-label="Second linked player bib"><button class="primary" onclick="addLink()">Link players</button></div><div class="err" id="lerr"></div>`}
   ${linkRows?`<div class="scroll"><table>${linkRows}</table></div>`:'<p class="muted">None</p>'}</section>
  <section class="panel"><h2>3. Availability changes</h2><p class="sub">Enter a bib, then tick every weeknight she can practice. Saving a change marks her confirmed.</p>
   ${locked?'':`<div class="row"><input id="ab" inputmode="numeric" placeholder="Bib" style="width:110px" aria-label="Bib" value="${EDIT||''}"><button class="ghost" onclick="findBib()">Find player</button></div><div class="err" id="berr"></div>${EDIT?editor(EDIT):''}`}
   ${ch.length?`<div class="scroll"><table><tr><th class="num">Bib</th><th>Player</th><th>Before</th><th>Now</th><th></th></tr>${ch.map(b=>`<tr><td class="num"><b>${b}</b></td><td>${esc(nm(b))}</td><td>${PL[b].prev.map(x=>NN[x]).join(', ')}${PL[b].prevConfirmed?'':' <span class="flag should">unconfirmed</span>'}</td><td>${PL[b].nights.map(x=>NN[x]).join(', ')}</td><td>${locked?'':`<button class="ghost" onclick="rmNights(${b})">Undo</button>`}</td></tr>`).join('')}</table></div>`:'<p class="muted">No changes yet.</p>'}
   ${unconf.length?`<p style="margin-top:14px"><b>Still unconfirmed (${unconf.length}).</b> Ask these families at check-in:</p><div class="row">${unconf.map(b=>locked?`<span>#${b} ${esc(nm(b))}</span>`:`<button class="ghost" onclick="EDIT=${b};render()">#${b} ${esc(nm(b))}</button>`).join('')}</div><p class="muted">Anyone left here stays available all five nights, marked unconfirmed.</p>`:'<p class="ok-txt">Every player’s availability is confirmed.</p>'}</section>`;
  h+=nightCheck();
  h+=`<p><button class="primary" onclick="S.ciDone=true;go(1)">Check-in done: go to draft order</button></p><p class="muted">Data loaded ${esc(BUNDLE.built)} · version ${S.hash}</p>`;
  $('#app').innerHTML=h;const ab=$('#ab');if(ab)ab.onkeydown=e=>{if(e.key==='Enter')findBib();};}
function editor(b){const cur=PL[b].nights;return `<div class="note" style="margin-top:12px"><b>#${b} ${esc(nm(b))}</b> <span class="muted">· registration said “${esc(PL[b].raw||'')}”${PL[b].confirmed?'':' (unconfirmed)'}</span>
  <div class="row" style="margin-top:10px">${NIGHTS.map(x=>`<label class="nt"><input type="checkbox" class="nck" value="${x}" ${cur.includes(x)?'checked':''}> ${NL[x]}</label>`).join('')}</div>
  <div class="row" style="margin-top:10px"><button class="primary" onclick="saveNights(${b})">Save change</button><button class="ghost" onclick="EDIT=null;render()">Cancel</button></div><div class="err" id="nerr"></div></div>`;}
function findBib(){const b=+$('#ab').value;if(!PL[b]){$('#berr').textContent=`#${$('#ab').value} isn’t in ${DATA.division}.`;return;}EDIT=b;render();}
function saveNights(b){const v=[...document.querySelectorAll('.nck:checked')].map(x=>x.value);if(!v.length){$('#nerr').textContent='Tick at least one night.';return;}
  const base=BASE.players.find(p=>p.bib===b);if(base.confirmed&&v.length===base.nights.length&&v.every(x=>base.nights.includes(x)))delete S.ci.nights[b];else S.ci.nights[b]=v;
  EDIT=null;applyCI();save();render();}
function rmNights(b){delete S.ci.nights[b];applyCI();save();render();}
function saveAbsent(){const v=[...new Set(nums($('#abs').value))].sort((a,b)=>a-b);const bad=v.filter(b=>!PL[b]);
  if(bad.length){$('#aerr').textContent=`Not in ${DATA.division}: ${bad.join(', ')}.`;return;}
  const graded=v.filter(b=>Object.values(S.grades).some(g=>['A','AB','C'].some(k=>(g[k]||[]).includes(b))));
  if(graded.length){$('#aerr').textContent=`Already graded by a coach, so not a no-show: ${graded.join(', ')}.`;return;}
  S.absent=v;S.noShow=S.noShow.filter(x=>v.includes(x.bib));save();render();}
function addLink(){const a=+$('#la').value,b=+$('#lb').value,err=m=>$('#lerr').textContent=m;
  if(!PL[a]||!PL[b])return err(`Both bibs must be in ${DATA.division}.`);if(a===b)return err('Enter two different bibs.');
  if(LINK[a])return err(`#${a} is already linked with #${LINK[a]}. Groups of three aren’t supported; call the commissioner.`);
  if(LINK[b])return err(`#${b} is already linked with #${LINK[b]}. Groups of three aren’t supported; call the commissioner.`);
  const da=daughterOf(a),db=daughterOf(b);if(da&&db&&da!==db)return err(`#${a} and #${b} are daughters of different coaches (${da}, ${db}). Call the commissioner.`);
  if(da&&db)return err(`#${a} and #${b} are both on ${da}’s team already.`);
  S.ci.links.push([Math.min(a,b),Math.max(a,b)]);applyCI();save();render();}
function rmLink(a,b){S.ci.links=S.ci.links.filter(l=>!(l[0]===a&&l[1]===b));applyCI();save();render();}

function setup(){const {base,E,max}=plan();const o=S.order;
  let h=`<section class="panel"><h2>Draft order</h2><p class="sub">Draw a random order for the ${T()} head coaches.</p>
  <div class="row"><button class="primary" onclick="draw()">${o?'Redraw order':'Draw draft order'}</button>${o?'':`<span class="muted">${Object.keys(S.coaches).map(esc).join(', ')}</span>`}</div></section>`;
  if(o){h+=`<section class="panel"><h2>Order, practice nights and coaches’ daughters</h2><p class="sub">Loaded by the commissioner. Daughters and their linked players are placed before the first pick.</p><div class="scroll"><table><tr><th class="num">Pick</th><th>Coach</th><th>Practice night</th><th>Daughters</th></tr>`+
    o.map((n,i)=>{const c=S.coaches[n];const ds=(c.daughters||[]).filter(d=>PL[d]);return `<tr><td class="num">${i+1}</td><td><b>${esc(n)}</b>${c.assistant?`<br><span class="muted">Asst: ${esc(c.assistant)}</span>`:''}</td><td>${NL[c.night]}</td>
    <td>${ds.length?ds.map(d=>`#${d} `+esc(nm(d))+(LINK[d]?` <span class="muted">+ linked #${LINK[d]}</span>`:'')).join('<br>'):'<span class="muted">none</span>'}</td></tr>`;}).join('')+`</table></div>
    <p>Missed evals: ${S.absent.length?S.absent.map(b=>`#${b} ${esc(nm(b))}`).join(', '):'none'} <span class="muted">(change on the Check-in step)</span></p>
    <p class="muted">Team plan: ${o.length} teams · ${E} of ${max}${E<o.length?`, ${o.length-E} of ${base}`:''}</p></section>`;
    h+=nightCheck();h+=`<p><button class="primary" onclick="go(2)">Enter eval grades</button></p>`;}
  $('#app').innerHTML=h;}
function nightCheck(){const L={A:[],C:[]};const sm=sim0();const rem=[...sm.und];const res=feasible(sm.teams,rem,()=> 'B');
  const used=[...new Set(coachNames().map(n=>S.coaches[n].night))];
  const rows=NIGHTS.filter(d=>used.includes(d)).map(d=>{const ts=sm.teams.filter(t=>t.night===d);const open=ts.reduce((s,t)=>s+plan().max-t.players.length,0);
    const can=rem.filter(b=>nightsOf(b).includes(d)).length;const only=rem.filter(b=>{const ok=nightsOf(b).filter(x=>used.includes(x));return ok.length===1&&ok[0]===d;});
    return `<tr><td>${NL[d]}</td><td class="num">${ts.length}</td><td class="num">${open}</td><td class="num">${can}</td><td>${only.length?only.map(b=>`#${b} ${esc(nm(b))}`).join(', '):'<span class="muted">none</span>'}</td></tr>`;}).join('');
  const none=rem.filter(b=>!nightsOf(b).some(x=>used.includes(x)));
  const pairs=DATA.links.filter(([a,b])=>!nightsOf(a).some(x=>nightsOf(b).includes(x)&&used.includes(x)));
  return `<section class="panel"><h2>Schedule check</h2><p class="sub">Runs at registration close and again after check-in changes.</p><div class="scroll"><table><tr><th>Night</th><th class="num">Teams</th><th class="num">Open spots</th><th class="num">Players who can make it</th><th>Players who can only make this night</th></tr>${rows}</table></div>
   ${res.ok&&!none.length&&!pairs.length?`<div class="note ok">A valid placement exists for every player.</div>`:`<div class="note must">${none.length?`No team practices on a night these players can make: ${none.map(b=>'#'+b).join(', ')}. `:''}${pairs.length?`Linked players with no shared night: ${pairs.map(p=>p.join('/')).join(', ')}. `:''}${!res.ok?`No valid placement for: ${res.unmatched.map(b=>'#'+b).join(', ')}.`:''}</div>`}</section>`;}
function sim0(){const teams=coachNames().map(n=>({name:n,night:S.coaches[n].night,players:[],a:0,c:0,qA:0,qC:0}));const und=new Set(ALL);
  teams.forEach(t=>{(S.coaches[t.name].daughters||[]).forEach(d=>{if(PL[d]&&und.has(d)){t.players.push({bib:d});und.delete(d);const s=LINK[d];if(s&&und.has(s)){t.players.push({bib:s});und.delete(s);}}});});return {teams,und};}
function draw(){if(S.picks.length&&!confirm('A draft is in progress. Redraw the order and clear all picks?'))return;
  S.order=shuffle(Object.keys(S.coaches));S.picks=[];save();render();}

function grades(){const o=S.order,i=S.gIdx,kinds=['A','AB','C'],lbl={A:'A players',AB:'A/B or B+ players',C:'C players'};
  let h=`<section class="panel">`;
  if(!gradesDone()){const coach=o[Math.floor(i/3)],k=kinds[i%3];
    h+=`<p class="muted">Coach ${Math.floor(i/3)+1} of ${o.length}</p><div class="big">Coach ${esc(coach)}, give me all your ${lbl[k]} in numerical order</div>
    <div class="pickbox"><input id="gin" style="width:min(520px,100%);font-size:26px;text-align:left" placeholder="e.g. 47, 64, 72" value="${((S.grades[coach]||{})[k]||[]).join(', ')}"><button class="primary" onclick="saveGrade()">Enter</button></div>
    <div class="err" id="gerr"></div><p class="muted">Leave blank and press Enter if the coach has none.</p>`;}
  else h+=`<h2>All grades entered</h2><p class="sub">Click a coach to correct an entry.</p><p><button class="primary" onclick="go(3)">Publish A & C lists</button></p>`;
  h+=`${DATA.sample?`<p><button class="ghost" onclick="sampleGrades()">Load sample grades (demo)</button></p>`:''}</section><section class="panel"><div class="scroll"><table><tr><th>Coach</th><th>A</th><th>A/B or B+</th><th>C</th></tr>`+
    o.map((c,ci)=>{const g=S.grades[c]||{};return `<tr><td><button class="ghost" onclick="S.gIdx=${ci*3};save();render()">${esc(c)}</button></td>${kinds.map(k=>`<td>${g[k]?g[k].join(', ')||'—':'<span class="muted">…</span>'}</td>`).join('')}</tr>`;}).join('')+`</table></div></section>`;
  $('#app').innerHTML=h;const gi=$('#gin');if(gi){gi.focus();gi.select();gi.onkeydown=e=>{if(e.key==='Enter')saveGrade();};}}
function saveGrade(){const o=S.order,i=S.gIdx,coach=o[Math.floor(i/3)],k=['A','AB','C'][i%3];const v=[...new Set(nums($('#gin').value))].sort((a,b)=>a-b);
  const bad=v.filter(b=>!PL[b]),abs=v.filter(b=>S.absent.includes(b));const g=S.grades[coach]||{};
  const dup=v.filter(b=>['A','AB','C'].filter(x=>x!==k).some(x=>(g[x]||[]).includes(b)));
  if(bad.length)return $('#gerr').textContent=`Not on this roster: ${bad.join(', ')}`;
  if(abs.length)return $('#gerr').textContent=`Missed evals: ${abs.join(', ')}. Those players are handled after the lists publish.`;
  if(dup.length)return $('#gerr').textContent=`Already on another list for this coach: ${dup.join(', ')}`;
  S.grades[coach]={...g,[k]:v};S.gIdx=i+1;while(S.gIdx<o.length*3&&S.grades[o[Math.floor(S.gIdx/3)]]&&S.grades[o[Math.floor(S.gIdx/3)]][['A','AB','C'][S.gIdx%3]])S.gIdx++;save();render();}
function sampleGrades(){if(!DATA.sample)return;S.order.forEach(c=>{if(DATA.sample[c])S.grades[c]=JSON.parse(JSON.stringify(DATA.sample[c]));});S.gIdx=S.order.every(c=>DATA.sample[c])?S.order.length*3:S.gIdx;save();render();}

function lists(){const L=computeLists(),t=T();const gs=b=>{const s=L.st[b];return [s.A?`${s.A} A`:'',s.AB?`${s.AB} A/B`:'',s.C?`${s.C} C`:''].filter(Boolean).join(', ');};
  const tie=L.flags.find(f=>f.tie);
  let h=`<div class="grid2"><section class="panel"><h2>A list · ${L.A.length}</h2><div class="big" style="font-size:30px">${[...L.A].sort((x,y)=>x-y).join(', ')}</div><p class="sub">${L.aNom.length} players nominated (any A or A/B). ${L.kA} per team × ${t} teams = ${L.kA*t}.${L.cutA.length?` Cut ${L.cutA.length}: fewest coaches naming her, then fewest A’s, then points.`:''}</p>
   ${L.flags.filter(f=>!f.tie).map(f=>`<div class="note must">${f}</div>`).join('')}
   ${tie?`<div class="note should">Tie at the cut: #${tie.kept} and #${tie.cut} are identical on every tiebreaker. <button class="ghost" onclick="S.tieSwap=!S.tieSwap;save();render()">Swap them</button></div>`:''}
   <div class="scroll"><table><tr><th class="num">Bib</th><th>Player</th><th>Grades</th><th class="num">Coaches</th><th class="num">Points</th><th></th></tr>${L.aNom.concat(L.bumps.filter(x=>x.tier==='A').map(x=>x.bib)).filter((b,i,a)=>a.indexOf(b)===i).sort((x,y)=>x-y).map(b=>{const inA=L.A.includes(b);const nb=L.bumps.find(x=>x.bib===b);const bo=L.bumps.find(x=>x.out===b);
     return `<tr${inA?'':' class="muted"'}><td class="num"><b>${b}</b></td><td>${esc(nm(b))}</td><td>${nb?'Missed evals — coach confirmed A':gs(b)}</td><td class="num">${nb?'':L.cov(b)}</td><td class="num">${nb?'':L.pts(b)}</td><td>${inA?'<span class="tier A">A</span>':bo?'bumped to B':'cut'}</td></tr>`;}).join('')}</table></div></section>
   <section class="panel"><h2>C list · ${L.C.length}</h2><div class="big" style="font-size:30px">${[...L.C].sort((x,y)=>x-y).join(', ')}</div><p class="sub">${L.cNom.length} players named C. ${L.kC} per team × ${t} teams = ${L.kC*t}.${L.cutC.length?' Cut by fewest C’s, then most experience.':''}</p>${L.cNotes.map(n=>`<div class="note">${n}</div>`).join('')}
   <div class="scroll"><table><tr><th class="num">Bib</th><th>Player</th><th class="num">C’s</th><th class="num">Yrs exp</th><th></th></tr>${L.cNom.concat(L.bumps.filter(x=>x.tier==='C').map(x=>x.bib)).filter((b,i,a)=>a.indexOf(b)===i).sort((x,y)=>x-y).map(b=>{const inC=L.C.includes(b);const bo=L.bumps.find(x=>x.out===b);return `<tr${inC?'':' class="muted"'}><td class="num"><b>${b}</b></td><td>${esc(nm(b))}</td><td class="num">${L.st[b].C||'—'}</td><td class="num">${(+PL[b].rec||0)+(+PL[b].trav||0)}</td><td>${inC?'<span class="tier C">C</span>':bo?'bumped to B':'cut'}</td></tr>`;}).join('')}</table></div></section></div>`;
  h+=`<section class="panel"><h2>Before the draft: players who missed evals</h2><p class="sub">Ask all coaches: is anyone who missed evals a definitive A or C?</p>
   <p>${S.absent.map(b=>`#${b} ${esc(nm(b))}`).join(' · ')||'None'}</p><div class="row"><input id="ns" placeholder="e.g. 79 A" style="width:160px"><button class="ghost" onclick="addNS()">Add</button>${S.noShow.length?`<button class="ghost" onclick="S.noShow=[];save();render()">Clear</button>`:''}</div><div class="err" id="nserr"></div>
   ${L.bumps.map(x=>`<div class="note">#${x.bib} ${esc(nm(x.bib))} added as ${x.tier}; #${x.out} ${esc(nm(x.out))} moves to B.</div>`).join('')}</section>`;
  const sm=sim();h+=`<section class="panel"><h2>Starting position</h2><p class="sub">Coaches’ daughters and their linked players are placed before the first pick.</p>${sm.notes.map(n=>`<div class="note must">${esc(n)}</div>`).join('')}
   <div class="scroll"><table><tr><th class="num">Pick</th><th>Coach</th><th>Night</th><th>Already on team</th><th>A’s needed</th><th>C’s needed</th></tr>${sm.teams.map((t,i)=>`<tr><td class="num">${i+1}</td><td><b>${esc(t.name)}</b></td><td>${NL[t.night]}</td><td>${t.pre.map(b=>`<span class="tier ${sm.tierOf(b)}">${sm.tierOf(b)}</span> #${b} ${esc(nm(b))}`).join('<br>')||'—'}</td><td>${t.qA-t.a}</td><td>${t.qC-t.c}</td></tr>`).join('')}</table></div>
   <p><button class="primary" onclick="go(4)">Start the draft</button></p></section>`;
  $('#app').innerHTML=h;}
function addNS(){const v=$('#ns').value.trim().toUpperCase();const m=v.match(/^(\d+)\s*(A|C)$/);if(!m)return $('#nserr').textContent='Enter a bib and A or C, e.g. 79 A';
  const b=+m[1];if(!S.absent.includes(b))return $('#nserr').textContent=`#${b} isn’t on the missed-evals list.`;S.noShow=S.noShow.filter(x=>x.bib!==b);S.noShow.push({bib:b,tier:m[2]});save();render();}

let PENDING=null;
function draft(){const sm=sim();const c=sm.cur;let h='';
  if(!c){h+=`<section class="panel"><h2>Draft complete</h2><p class="sub">${sm.und.size?`${sm.und.size} players could not be placed: ${[...sm.und].map(b=>'#'+b).join(', ')}.`:'Every player is on a team.'}</p><button class="primary" onclick="go(5)">View rosters</button> <button class="ghost" onclick="undo()">Undo last pick</button></section>`;}
  else{const t=c.t,an=c.an;const tierName={A:'A’s',C:'C’s',B:'B’s'}[c.tr];
    h+=`<div class="clock"><section><div class="onclock"><div class="lbl">Round ${c.r+1} · ${tierName} · pick ${c.overall}</div><div class="who">${esc(t.name)}</div>
      <div class="meta">${NL[t.night]} · A’s ${t.a} of ${t.qA} · C’s ${t.c} of ${t.qC} · roster ${t.players.length} of ${plan().max}</div></div>
      ${an.degraded?`<div class="status must">Placement problem: ${an.degraded.map(b=>'#'+b).join(', ')} no longer fit any team. Confirm availability or undo.</div>`:''}
      <div class="status ${an.kind}">${esc(an.msg)}</div>
      <div class="pickbox"><input id="pin" inputmode="numeric" placeholder="Bib #" aria-label="Bib number"><button class="primary" onclick="pick()">Enter pick</button><button class="ghost" onclick="undo()" ${S.picks.length?'':'disabled'}>Undo</button></div><div class="err" id="perr"></div></section>
      <section class="panel" style="margin:0"><h2>Available ${tierName}</h2><p class="sub">${an.elig.length} left · grayed players don’t fit ${NL[t.night]}</p><div class="scroll board"><table>${an.elig.sort((a,b)=>a-b).map(b=>{
        const cls=!an.nightOk.includes(b)||an.blocked.includes(b)?'blocked':an.kind==='must'&&an.allowed.length<=4?'mand':an.scarce.includes(b)?'sugg':'allowed';
        return `<tr class="${cls}"><td class="num"><b>${b}</b></td><td>${esc(nm(b))}${LINK[b]&&sm.und.has(LINK[b])?` <span class="muted">+ linked #${LINK[b]}</span>`:''}</td><td>${chips(b)}</td></tr>`;}).join('')}</table></div></section></div>`;}
  h+=`<section class="panel" style="margin-top:20px"><h2>Teams</h2><div class="teams">${sm.teams.map(t=>`<div class="team ${c&&c.t===t?'cur':''}"><h3>${esc(t.name)}</h3><div class="tm">${NL[t.night]} · ${t.players.length} players</div><ol>${t.players.map(p=>`<li><span class="tier ${sm.tierOf(p.bib)}">${sm.tierOf(p.bib)}</span> #${p.bib} ${esc(nm(p.bib))}</li>`).join('')}</ol></div>`).join('')}</div></section>
   <section class="panel"><details><summary>Night-by-night slack</summary>${slack(sm)}</details></section>
   <section class="panel"><h2>Log</h2><div class="log">${sm.log.slice().reverse().map(l=>`<div>${esc(l.t)}</div>`).join('')||'<span class="muted">No picks yet.</span>'}</div></section>`;
  $('#app').innerHTML=h;const pi=$('#pin');if(pi){pi.focus();pi.onkeydown=e=>{if(e.key==='Enter')pick();};}}
function slack(sm){const used=[...new Set(sm.teams.map(t=>t.night))];const rem=[...sm.und];
  return `<div class="scroll"><table><tr><th>Night</th><th class="num">Open spots</th><th class="num">Players left who can make it</th><th class="num">Players left who can only make it</th></tr>${NIGHTS.filter(d=>used.includes(d)).map(d=>{const open=sm.teams.filter(t=>t.night===d).reduce((s,t)=>s+plan().max-t.players.length,0);
    const only=rem.filter(b=>{const ok=nightsOf(b).filter(x=>used.includes(x));return ok.length===1&&ok[0]===d;}).length;return `<tr><td>${NL[d]}</td><td class="num">${open}</td><td class="num">${rem.filter(b=>nightsOf(b).includes(d)).length}</td><td class="num">${only}</td></tr>`;}).join('')}</table></div>`;}
function pick(){const sm=sim(),c=sm.cur;if(!c)return;const b=+$('#pin').value;const err=m=>$('#perr').textContent=m;
  if(!PL[b])return err(`#${$('#pin').value} isn’t on this roster.`);if(!sm.und.has(b))return err(`#${b} ${nm(b)} is already on a team.`);
  if(sm.tierOf(b)!==c.tr)return err(`#${b} is ${sm.tierOf(b)==='A'?'an':'a'} ${sm.tierOf(b)}. This round is ${c.tr}’s only.`);
  if(c.an.allowed.includes(b)){commit({bib:b});return;}
  const d=$('#dlg');const night=c.t.night;
  if(!nightsOf(b).includes(night)){d.innerHTML=`<h2 class="cond" style="margin-top:0">#${b} ${esc(nm(b))} isn’t available ${NL[night]}s</h2><p>She listed ${nightsOf(b).map(x=>NL[x]).join(', ')}.</p><div class="row"><button class="ghost" onclick="dlgClose()">Choose again</button><button class="primary" onclick="commit({bib:${b},night:'${night}'})">Family confirmed ${NL[night]} — keep pick</button></div>`;}
  else{const L=sm.L;d.innerHTML=`<h2 class="cond" style="margin-top:0">Taking #${b} strands another player</h2><p>${esc(c.an.msg)}</p><div class="row"><button class="ghost" onclick="dlgClose()">Choose again</button><button class="primary" onclick="commit({bib:${b},force:true})">Keep pick anyway</button></div>`;}
  d.showModal();}
function dlgClose(){$('#dlg').close();const p=$('#pin');if(p){p.value='';p.focus();}}
function commit(p){if($('#dlg').open)$('#dlg').close();S.picks.push(p);save();render();}
function undo(){S.picks.pop();save();render();}

function rosters(){const sm=sim();const issues=[];sm.teams.forEach(t=>t.players.forEach(p=>{if(!nightsOf(p.bib).includes(t.night))issues.push(`#${p.bib} on ${t.name} (${NL[t.night]})`);}));
  $('#app').innerHTML=`<section class="panel"><h2>Final rosters</h2><p class="sub">${sm.und.size?`${sm.und.size} players not yet placed.`:'All players placed.'} ${issues.length?'Night conflicts: '+issues.join(', '):'Every player is on a team that practices a night she can make.'}</p>
   <div class="teams">${sm.teams.map(t=>`<div class="team"><h3>${esc(t.name)}</h3><div class="tm">${NL[t.night]} · ${t.players.length} players · ${t.a} A · ${t.c} C</div><ol>${t.players.map(p=>`<li><span class="tier ${sm.tierOf(p.bib)}">${sm.tierOf(p.bib)}</span> #${p.bib} ${esc(nm(p.bib))}${p.how!=='pick'?` <span class="muted">(${p.how==='daughter'?'coach’s daughter':'linked player'})</span>`:''}</li>`).join('')}</ol></div>`).join('')}</div></section><section class="panel"><h2>Share results</h2><p class="sub">Click the box, copy everything, and paste it into Claude to audit the draft.</p><textarea readonly style="width:100%;height:240px;font:13px ui-monospace,Menlo,Consolas,monospace" onclick="this.select()">${esc(exportText(sm))}</textarea></section>`;}
function exportText(sm){const L=sm.L;return ['CGGBL draft results — '+DATA.division,
'Order: '+S.order.map((n,i)=>`${i+1}. ${n} (${NN[S.coaches[n].night]}, daughters ${(S.coaches[n].daughters||[]).map(b=>'#'+b).join(' ')||'none'})`).join('; '),
'Data: loaded '+BUNDLE.built+', version '+S.hash,
'Check-in no-shows: '+(S.absent.map(b=>'#'+b+' '+nm(b)).join(', ')||'none'),
'Check-in availability changes: '+(Object.keys(S.ci.nights).map(Number).map(b=>`#${b} ${nm(b)}: ${PL[b].prev.map(x=>NN[x]).join('/')}${PL[b].prevConfirmed?'':' (unconfirmed)'} -> ${PL[b].nights.map(x=>NN[x]).join('/')}`).join('; ')||'none'),
'Check-in sister links: '+(S.ci.links.map(l=>'#'+l[0]+'/#'+l[1]).join(', ')||'none'),
'Grades: '+JSON.stringify(S.grades),
'Missed evals added: '+JSON.stringify(S.noShow)+(S.tieSwap?' (tie swapped)':''),
'A list: '+[...L.A].sort((a,b)=>a-b).join(', '),
'C list: '+[...L.C].sort((a,b)=>a-b).join(', '),
'Picks: '+JSON.stringify(S.picks),
...sm.teams.map(t=>`${t.name} (${NN[t.night]}): `+t.players.map(p=>`#${p.bib} ${nm(p.bib)} [${sm.tierOf(p.bib)}; ${nightsOf(p.bib).map(x=>NN[x]).join('/')}]${p.how!=='pick'?' ('+p.how+')':''}`).join(', ')),
'Unplaced: '+([...sm.und].join(', ')||'none'),
'Log: '+sm.log.map(l=>l.t).join(' | ')].join('\n');}
(function boot(){let p=null;try{p=sessionStorage.getItem('cggbl-pass')}catch(e){}if(p)unlock(p);else render();})();
</script>
</body>
</html>
